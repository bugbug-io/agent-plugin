schema_version: '1.0'
schema_type: project
data:
  name: 'Minimal project'
  homepage_url: 'https://example.com'
  settings:
    general:
      timezone: 'UTC'
      default_local_run_timeout: 300
      default_cloud_run_timeout: 300
      default_sleep: 0
      close_windows_on_successful_test_run: true
      capture_dom_on_failure: true
      collecting_logs: disabled
    browser:
      incognito_mode: true
    screen_sizes:
      desktop:
        width: 1366
        height: 768
      mobile:
        width: 390
        height: 844
    selectors:
      generation_mode: automatic
      non_semantic_classes_enabled: false
    waiting_conditions: []
