schema_version: '1.0'
schema_type: component
data:
  component_name: 'Login component'
  steps:
    - action: goto
      name: 'Open login page'
      action_details:
        url: 'https://example.com/login'

    - action: type
      name: 'Enter email'
      action_details:
        selector: "xpath=//input[@name='email']"
        value: '{{email}}'
        has_secret_value: false

    - action: type
      name: 'Enter password'
      action_details:
        selector: "xpath=//input[@name='password']"
        value: '{{password}}'
        has_secret_value: true

    - action: click
      name: 'Submit'
      action_details:
        selector: "xpath=//button[@type='submit']"
